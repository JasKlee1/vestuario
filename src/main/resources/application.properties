# ===== Aplicacion =====
spring.application.name=vestuario
server.port=8087
 
# ===== Base de datos H2 en memoria =====
spring.datasource.url=jdbc:h2:mem:vestuariodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 
# Consola web de H2: http://localhost:8086/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
 
# ===== JPA / Hibernate =====
# create-drop: crea las tablas al iniciar y las elimina al detener la aplicacion
spring.jpa.hibernate.ddl-auto=create-drop
# Muestra en consola las sentencias SQL que genera Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Mantiene la sesion abierta durante la vista (necesario para relaciones LAZY en Thymeleaf)
spring.jpa.open-in-view=true
 
# ===== Thymeleaf =====
spring.thymeleaf.cache=false
 
# ===== Pagina de error =====
server.error.include-message=always
