<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragmentos comunes de la interfaz. Cada vista los incluye con th:replace, por ejemplo:
  <head th:replace="~{fragmentos/plantilla :: head('Clubes')}"></head>
-->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Vestuario'">Vestuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/vestuario.css}" href="../../static/css/vestuario.css" rel="stylesheet">
</head>
<body>
 
<!-- ===== Menu lateral: fijo en escritorio, panel deslizable en movil ===== -->
<div th:fragment="lateral(seccion)" class="lateral-marco">
    <aside class="offcanvas-lg offcanvas-start lateral" tabindex="-1" id="menuLateral" aria-labelledby="marcaLateral">
        <div class="offcanvas-header d-lg-none">
            <span class="marca" id="marcaLateral"><span class="marca-icono"><i class="bi bi-clipboard2-check-fill" aria-hidden="true"></i></span>Vestuario</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                    data-bs-target="#menuLateral" aria-label="Cerrar menú"></button>
        </div>
        <div class="offcanvas-body lateral-cuerpo">
            <a class="marca d-none d-lg-flex" th:href="@{/}">
                <span class="marca-icono"><i class="bi bi-clipboard2-check-fill" aria-hidden="true"></i></span>Vestuario
            </a>
            <nav class="lateral-nav" aria-label="Secciones">
                <a th:href="@{/clubes}" th:classappend="${seccion == 'clubes'} ? 'activo'">
                    <i class="bi bi-shield-fill" aria-hidden="true"></i> Clubes</a>
                <a th:href="@{/asociaciones}" th:classappend="${seccion == 'asociaciones'} ? 'activo'">
                    <i class="bi bi-bank2" aria-hidden="true"></i> Asociaciones</a>
                <a th:href="@{/competiciones}" th:classappend="${seccion == 'competiciones'} ? 'activo'">
                    <i class="bi bi-trophy-fill" aria-hidden="true"></i> Competiciones</a>
            </nav>
            <div class="lateral-pie">
                <a th:href="@{/h2-console}" target="_blank" rel="noopener">
                    <i class="bi bi-database" aria-hidden="true"></i> Consola H2</a>
                <p>Base de datos en memoria: los cambios se borran al reiniciar.</p>
            </div>
        </div>
    </aside>
</div>
 
<!-- ===== Barra superior solo en movil ===== -->
<header th:fragment="barraMovil" class="barra-movil d-lg-none">
    <a class="marca" th:href="@{/}">
        <span class="marca-icono"><i class="bi bi-clipboard2-check-fill" aria-hidden="true"></i></span>Vestuario
    </a>
    <button class="btn btn-icono" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral"
            aria-controls="menuLateral" aria-label="Abrir menú">
        <i class="bi bi-list" aria-hidden="true"></i>
    </button>
</header>
 
<!-- ===== Avisos (mensajes flash) ===== -->
<div th:fragment="avisos">
    <div th:if="${exito}" class="alert aviso aviso-exito alert-dismissible fade show" role="status">
        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        <span th:text="${exito}">Guardado</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar aviso"></button>
    </div>
    <div th:if="${error}" class="alert aviso aviso-error alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i>
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar aviso"></button>
    </div>
</div>
 
<!-- ===== Scripts ===== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
 
</body>
</html>
