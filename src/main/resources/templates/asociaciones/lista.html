<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: head('Asociaciones')}"></head>
<body>
<div class="app">
    <div th:replace="~{fragmentos/plantilla :: lateral('asociaciones')}"></div>
    <div class="app-principal">
        <header th:replace="~{fragmentos/plantilla :: barraMovil}"></header>
        <main class="app-contenido">
            <div th:replace="~{fragmentos/plantilla :: avisos}"></div>
 
            <div class="encabezado">
                <div>
                    <h1>Asociaciones</h1>
                    <p class="encabezado-texto">Federaciones a las que se afilian los clubes. Una asociación con clubes afiliados no se puede eliminar.</p>
                </div>
            </div>
 
            <div class="row g-4">
                <!-- Formulario de alta -->
                <div class="col-lg-4">
                    <section class="panel">
                        <h2 class="panel-titulo">Nueva asociación</h2>
                        <form th:action="@{/asociaciones}" th:object="${asociacion}" method="post" novalidate class="vstack gap-3">
                            <div>
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid" maxlength="80">
                                <div class="invalid-feedback" th:errors="*{nombre}"></div>
                            </div>
                            <div class="row g-3">
                                <div class="col-5">
                                    <label for="siglas" class="form-label">Siglas</label>
                                    <input type="text" th:field="*{siglas}" class="form-control" th:errorclass="is-invalid" maxlength="10">
                                    <div class="invalid-feedback" th:errors="*{siglas}"></div>
                                </div>
                                <div class="col-7">
                                    <label for="pais" class="form-label">País</label>
                                    <input type="text" th:field="*{pais}" class="form-control" th:errorclass="is-invalid" maxlength="40">
                                    <div class="invalid-feedback" th:errors="*{pais}"></div>
                                </div>
                            </div>
                            <div>
                                <label for="presidente" class="form-label">Presidente <span class="opcional">(opcional)</span></label>
                                <input type="text" th:field="*{presidente}" class="form-control" th:errorclass="is-invalid" maxlength="60">
                                <div class="invalid-feedback" th:errors="*{presidente}"></div>
                            </div>
                            <button type="submit" class="btn btn-pino">Guardar asociación</button>
                        </form>
                    </section>
                </div>
 
                <!-- Listado -->
                <div class="col-lg-8">
                    <section class="panel">
                        <h2 class="panel-titulo">Registradas</h2>
                        <p th:if="${#lists.isEmpty(asociaciones)}" class="nota mb-0">Aún no hay asociaciones. Registra la primera con el formulario.</p>
                        <div class="table-responsive" th:unless="${#lists.isEmpty(asociaciones)}">
                            <table class="table tabla align-middle mb-0">
                                <thead>
                                <tr>
                                    <th scope="col">Siglas</th>
                                    <th scope="col">Nombre</th>
                                    <th scope="col">País</th>
                                    <th scope="col" class="text-center">Clubes</th>
                                    <th scope="col" class="text-end"><span class="visually-hidden">Acciones</span></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="a : ${asociaciones}">
                                    <td><span class="sigla" th:text="${a.siglas}">FCF</span></td>
                                    <td>
                                        <span th:text="${a.nombre}">Federación</span>
                                        <small class="d-block texto-suave" th:if="${a.presidente != null}" th:text="'Presidente: ' + ${a.presidente}">Presidente</small>
                                    </td>
                                    <td th:text="${a.pais}">Colombia</td>
                                    <td class="text-center"><span class="conteo" th:text="${clubesPorAsociacion.get(a.id)}">1</span></td>
                                    <td class="text-end">
                                        <form th:action="@{/asociaciones/{id}/eliminar(id=${a.id})}" method="post"
                                              onsubmit="return confirm('¿Eliminar esta asociación?');">
                                            <button type="submit" class="btn btn-sm btn-icono btn-icono-peligro"
                                                    th:attr="aria-label='Eliminar ' + ${a.siglas}">
                                                <i class="bi bi-trash3" aria-hidden="true"></i></button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
